      - bullet: "Computational social scientist studying political communication, disinformation, and hate speech on social media, with a focus on Nepal and Europe. My work combines text-as-data methods, large language models, and multimodal analysis with questions about how citizens encounter and respond to political content. Before moving into social science, I worked for six years as a software engineer, which allows me to build and maintain research pipelines independently."

